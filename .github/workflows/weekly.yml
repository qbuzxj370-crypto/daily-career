name: career-scout

on:
  schedule:
    # cron은 UTC 기준. 목 22:00 UTC == 금 07:00 KST (KST = UTC+9)
    - cron: "0 22 * * 4"
    # ⚠️ 임시 — 2026-08-11(화) 10:00 KST 테스트용. 01:00 UTC == 10:00 KST.
    #    이 날짜가 지나면 다시는 발동하지 않으므로 방치해도 무해하지만, 확인이 끝나면 지울 것.
    - cron: "0 1 11 8 *"
  workflow_dispatch: {}   # 수동 실행(P5 검증) — 테스트는 이쪽이 훨씬 확실하다

# 동시 실행 방지(중복 발행 방지 보조 — 정본 멱등은 노션 주차 조회)
concurrency:
  group: career-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Node 20 런타임이 폐기돼 v4/v5는 강제로 Node 24에서 돌며 경고를 낸다(2025-09 공지).
      # v7은 action.yml이 `using: node24`라 경고 없이 돈다 — 버전을 올릴 땐 그 값을 확인할 것.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Rule tests (판정 기준 회귀 방지)
        run: python -m pytest tests -q

      - name: Weekly scout
        env:
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          # 워크넷은 공개 페이지 파싱이라 키가 없다(고용24 OPEN-API는 기업회원 전용).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # 선택 — 미설정 시 슬랙 단계 자동 스킵
        run: python -m src.pipeline --publish
